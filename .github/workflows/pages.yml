name: Deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Prepare site
        run: |
          mkdir -p _site
          cp dashboard.html index.html robots.txt _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Retry deploy on transient failure
        if: steps.deploy.outcome == 'failure'
        id: deploy-retry
        uses: actions/deploy-pages@v5

      - name: Fail job if both attempts failed
        if: always() && steps.deploy.outcome == 'failure' && steps.deploy-retry.outcome == 'failure'
        run: |
          echo "::error::Pages deploy failed after 2 attempts"
          exit 1
